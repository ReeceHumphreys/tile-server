[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tile-service"
version = "0.1.0"
description = "Build and publish planetary imagery and elevation as PMTiles."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = ["numpy>=2,<3", "rasterio==1.5.2", "pmtiles==3.7.0", "boto3>=1.42,<2"]

[project.scripts]
tile-service = "tile_service.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "moto[s3]>=5,<6"]

[tool.hatch.build.targets.wheel]
packages = ["tile_service"]

[tool.hatch.build.targets.wheel.force-include]
datasets = "tile_service/datasets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "deployment: tests the real deployed HTTP endpoint (TILE_TEST_URL)",
  "s3: tests the S3 publishing contract",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# GDAL environment settings must precede rasterio imports.
per-file-ignores = { "tile_service/runtime.py" = ["E402"] }
